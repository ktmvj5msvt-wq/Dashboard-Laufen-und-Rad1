services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    # Nur lokal binden; die Veröffentlichung übernimmt der HTTPS-Proxy unten.
    ports:
      - "127.0.0.1:8000:8000"

  # Optional: automatisches HTTPS (Let's Encrypt). Domain in der Caddyfile eintragen und
  # den Dienst aktivieren, sonst einen vorhandenen Reverse-Proxy verwenden.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["https"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [dashboard]

volumes:
  caddy_data:

